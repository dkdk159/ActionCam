name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode*.app | head -1)
        echo "Using $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        xcodebuild -version

    - name: Build for device (no signing)
      run: |
        set -o pipefail
        xcodebuild \
          -project ActionCam.xcodeproj \
          -target ActionCam \
          -configuration Debug \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build.log | tail -n 120

    - name: Show errors if failed
      if: failure()
      run: grep -n -E "error:|warning: .*deprecat" build.log | head -n 80 || true

    - name: Package IPA
      run: |
        APP_PATH=$(find . -name "ActionCam.app" -path "*Debug-iphoneos*" | head -1)
        echo "App: $APP_PATH"
        if [ -n "$APP_PATH" ]; then
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -q -r ActionCam.ipa Payload
          cd ..
          ls -la output
        fi

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ActionCam-IPA
        path: output/ActionCam.ipa
        if-no-files-found: error

    - name: Upload app bundle
      uses: actions/upload-artifact@v4
      with:
        name: ActionCam-App
        path: output/Payload/ActionCam.app
